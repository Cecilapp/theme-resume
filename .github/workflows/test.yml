name: Test and build demo

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CECIL_BASEURL: https://cecilapp.github.io/theme-resume/
      CECIL_CANONICALURL: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Cecil
        run: |
          curl -sSOL https://cecil.app/cecil.phar
          php cecil.phar --version

      - name: Install theme in demo site
        run: |
          mkdir -p ./demo/themes/resume
          cp -r config.yml theme.yml layouts assets translations ./demo/themes/resume/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build demo
        run: php cecil.phar build ./demo -v

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./demo/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
